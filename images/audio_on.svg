<svg width="14" height="17" viewBox="0 0 14 17" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .equalizer-line-1 {
        transform-origin: center center; /* Adjusted value */
        animation: equalizerAnimation1 1.5s infinite alternate;
        }

        .equalizer-line-2 {
        transform-origin: center center; /* Adjusted value */
        animation: equalizerAnimation2 2s infinite alternate;
        }

        .equalizer-line-3 {
        transform-origin: center center; /* Adjusted value */
        animation: equalizerAnimation3 2.2s infinite alternate;
        }

        @keyframes equalizerAnimation1 {
        from {
        transform: scaleY(1.4);
        }
        to {
        transform: scaleY(2.2);
        }
        to {
        transform: scaleY(1);
        }
        to {
        transform: scaleY(0.7);
        }
        }

        @keyframes equalizerAnimation2 {
        from {
        transform: scaleY(0.3);
        }
        to {
        transform: scaleY(1.5);
        }
        to {
        transform: scaleY(0.8);
        }
        to {
        transform: scaleY(1.7);
        }
        }

        @keyframes equalizerAnimation3 {
        from {
        transform: scaleY(0.5);
        }
        to {
        transform: scaleY(1.1);
        }
        to {
        transform: scaleY(0.4);
        }
        to {
        transform: scaleY(0.8);
        }
        }
    </style>
